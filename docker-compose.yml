services:
  db:
    image: postgres:18-alpine
    container_name: wms_postgres
    restart: always
    environment:
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_password
      POSTGRES_DB: wms_db
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # <--- Автоматически накатит скрипт при первом старте
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_user -d wms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=wms_user
      - DB_PASSWORD=wms_password
      - DB_NAME=wms_db
      - DB_SSLMODE=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: